<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title>72cun 网址收藏</title>
    <link rel="stylesheet" type="text/css" href="/layui/css/layui.css" />
    <link rel="stylesheet" type="text/css" href="/css/login.css" />
</head>

<body>
<div class="m-login-bg">
    <div class="m-login">
        <h3>重置密码</h3>
        <div class="m-login-warp layui-form">

            <div class="layui-form-item">
                <label class="layui-form-label">手机号</label>
                <div class="layui-input-block">
                    <input type="text" id="phoneNumber" lay-verify="myPhoneNumber" name="phoneNumber" placeholder="" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">验证码</label>
                <div class="layui-input-inline" style="width: 120px;margin-left: 15px;margin-right: -10px">
                    <input type="text" id="yzm" lay-verify="myYZM" name="code" placeholder="" autocomplete="off" class="layui-input" >
                </div>
                <button id="getCode" class="layui-btn layui-btn-primary" style="float: left">获取验证码</button>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">新密码</label>
                <div class="layui-input-block">
                    <input type="password" id="password" lay-verify="myPassword" name="password"  placeholder="" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item" style="margin-top: 30px;text-align: center">
                <button class="layui-btn" lay-submit lay-filter="registerSubmit" id="register">重置密码</button>
                <button class="layui-btn" id="back">返回</button>
            </div>
        </div>
    </div>

</div>


<!-- 验证码划动验证 -->
<div class="verify-wrap" id="verify-wrap2" style="display: none;margin-top: 40px"></div>

<script src="/js/jquery.min.js"></script>
<script src="/layui/layui.js"></script><!-- 需要首先加载 -->
<script src="/myjs/app.js?v=1.0.0"></script>
<script src="/js/util.js"></script>
<script src="/js/jq-slideVerify.js"></script><!-- 验证码划动验证 -->
<script>
    layui.use(['layer','form',"jquery"], function() {
        var layer = layui.layer;
        var form = layui.form;
        var $=layui.jquery;
        var checkLayer;//划动检验窗口

        form.verify({
            myPhoneNumber: function(value, item){ //value：表单的值、item：表单的DOM对象
                if(!(/^1\d{10}$/.test($("#phoneNumber").val()))){
                    return '请输入正确的手机号!';
                }
            },
            myYZM: [/^\d{6}$/,'验证码为6为数字'],
            myPassword: [/^.{1,20}$/,'长度在1~20之间']
        });

        //发送验证码后1分钟定时
        var wait=60;
        function time() {
            if (wait == 0) {
                $("#getCode").attr("class","layui-btn layui-btn-primary");//按钮生效
                $("#getCode").text("获取验证码");
                wait = 60;
            } else {
                $("#getCode").attr("class","layui-btn layui-btn-disabled");//按钮失效
                $("#getCode").text("重新发送(" + wait + ")");
                wait--;
                setTimeout(function() {
                        time()
                },1000)
            }
        }

        //创建验证码划动验证
        var SlideVerifyPlug = window.slideVerifyPlug;
        var slideVerify2 = new SlideVerifyPlug('#verify-wrap2',{
            wrapWidth:'300',
            initText:'请按住滑块',
            sucessText:'验证通过',
            getSucessState:function(res){
                //当验证完成的时候,触发这个函数;返回 res 值 true
                if(res==true){
                    //发送获取验证码的请求
                    util.ajax("/phone/sendCode",{phoneNumber:$("#phoneNumber").val()},function (data) {
                        if(data.code==0){
                            setTimeout(function () {
                                layer.close(checkLayer);//关闭划动验证窗口
                                layer.msg("验证码已发送,请注意查收!", {offset: '50px', anim: 0});
                                slideVerify2.resetVerify();//重置划动验证
                                time();//开始1分钟的定时
                            },500)
                        }else{
                            layer.msg("验证码已发送失败,请稍后再试!", {offset: '50px', anim: 0});
                        }
                    })
                }
            }

        });

        //获取手机验证码
        $("#getCode").click(function () {
            if($("#getCode").attr("class")=="layui-btn layui-btn-primary"){

                //校验手机号
                var phoneNumber=$("#phoneNumber").val();
                if(phoneNumber==""){
                    layer.msg("手机号不能为空!", {offset: '50px', anim: 0});
                    return;
                }
                if(!(/^1\d{10}$/.test($("#phoneNumber").val()))){
                    layer.msg("请输入正确的手机号!", {offset: '50px', anim: 0});
                    return false;
                }

                //判断手机号是否已经存在(注册)
                util.ajax("/phone/isPhoneNumberExist",{phoneNumber:phoneNumber},function (data) {
                    if(data=="1"){
                        //打开划动验证
                        checkLayer=layer.open({
                            type: 1,
                            shadeClose: true,
                            title:'划动验证',
                            area: ['360px', '160px'], //宽高
                            content: $("#verify-wrap2")
                        });
                    }else{
                        layer.msg("该手机号未注册", {offset: '50px', anim: 0});
                    }
                })


            }
        })

        //重置密码事件
        form.on('submit(registerSubmit)', function(formData){
            $.ajax({
                url:"/user/updatePassword",
                type:'post',
                dataType:"json",
                data:formData.field,
                success:function (data) {
                    if(data.code==0){
                        layer.msg(data.message, {offset: '50px', anim: 0});
                        setTimeout(function () {
                            window.location.href='/';
                        },700)
                    }else{
                        layer.msg(data.message, {offset: '50px', anim: 0});
                    }
                }
            })
            return false;
        });

        $("#back").on('click',function () {
            window.location.href='/';
        })



    });
</script>
</body>

</html>
