<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title>72cun 网址收藏</title>
    <link rel="stylesheet" type="text/css" href="/layui/css/layui.css" />
    <link rel="stylesheet" type="text/css" href="/css/login.css" />

</head>

<body>
<div class="m-login-bg">
    <div class="m-login">
        <h3>72cun 网址收藏</h3>
        <div class="m-login-warp layui-form">

            <div class="layui-form-item">
                <label class="layui-form-label">账号</label>
                <div class="layui-input-block">
                    <input type="text" id="userName" lay-verify="myUserName" name="userName" placeholder="手机号/用户名" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">密码</label>
                <div class="layui-input-block">
                    <input type="password" id="password"  lay-verify="myPassword" name="password"  placeholder="" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item" style="margin-top: 60px;text-align: center">
                    <button class="layui-btn" lay-submit lay-filter="loginSubmit" id="login">登入</button>
                    <a href="/public/quickStart.html" class="layui-btn" target="_blank">预览</a>
            </div>

        </div>

        <div style="text-align: center;margin-top: 10px">
            <a href="/public/forgetPassword.html" style="font-size: 10px">忘记密码</a>
            <span>|</span>
            <a href="/public/register.html" style="font-size: 10px">注册账号</a>
        </div>

    </div>
</div>
<script src="/js/jquery.min.js"></script>
<script src="/layui/layui.js"></script><!-- 需要首先加载 -->
<script src="/myjs/app.js?v=1.0.0"></script>
<script>
    layui.use(['layer','form'], function() {
        var layer = layui.layer;
        var form = layui.form;

//        var num="";
//        for(var i=0;i<4;i++){
//            num+=Math.ceil(Math.random()*9);
//        }
//        $("#num").html(num);

        form.verify({
            myUserName: [/^.{1,20}$/,'长度在1~20之间']
            ,myPassword: [/^.{1,20}$/,'长度在1~20之间']
        });

        //注册事件
        form.on('submit(loginSubmit)', function(formData){
            $.ajax({
                url:"/login",
                type:'post',
                dataType:"json",
                data:formData.field,
                complete:function (data) {
                    if(data.responseJSON!=undefined && data.responseJSON.code==1){
                        layer.msg(data.responseJSON.message, {offset: '50px', anim: 0});
                    }else if(data.responseText!=undefined){
                        document.write(data.responseText);
                        document.close()
                    }
                },
            })
            return false;
        });

        //回车执行登入操作
        $(document).bind('keyup',function (event) {
            if (event.keyCode == "13") {
                $('#login').click();
            }
        })


    });
</script>
</body>

</html>
