<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>快速打开</title>

    <link rel="stylesheet" href="/layui/css/layui.css">

    <link rel="stylesheet" href="/css/eleTree.css" media="all">

    <style>
        .form-dialog,.hide{
            display: none;
        }
        /*设定表格特定的字体大小*/
        .layui-table-cell {
            font-size: 16px;
        }
        .folderTree{
            height: 320px;
            display: none
        }
        .selectFoldertree{
            height: 255px;
        }
    </style>


</head>
<body>
        <div class="layui-row">
            <div class="layui-col-md4">
                <form class="layui-form" action="">
                    <div class="layui-form-item" style="width: 110px;float: right">
                        <select name="interest" id="searchType">
                            <option value="0">综合查询</option>
                            <option value="1">名称查询</option>
                            <option value="2">位置查询</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="layui-col-md4">
                <input type="text" id="keywords" name="title" placeholder="输入关键字进行搜索" autocomplete="off" class="layui-input" style="float: left">
            </div>
            <div class="layui-col-md2">
                <div class="layui-btn-group">
                    <button class="layui-btn layui-btn-primary" id="searchBtn">
                        <i class="layui-icon layui-icon-search"></i> 搜索
                    </button>
                    <button class="layui-btn layui-btn-primary" id="addBtn">
                        <i class="layui-icon layui-icon-add-1"></i> 添加
                    </button>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="layui-form" lay-filter="example">
                    <label class="layui-form-label">批量打开</label>
                    <div class="layui-input-inline">
                        <input type="checkbox" name="close" lay-skin="switch" lay-text="ON|OFF">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-row" style="height: 90%">
            <table id="demo" lay-filter="test"></table>
        </div>


</body>

</html>

<!-- 工具栏模板： -->
<script type="text/html" id="toolbarDemo" lay-event="tool">
    <button class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit">编辑</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" lay-event="delete">删除</button>
</script>

<!-- 链接状态模板： -->
<script type="text/html" id="switchTpl">
    <input type="checkbox" name="isShare" lay-skin="switch" lay-text="共享|私有" lay-filter="isShare" {{ d.isShare == true ? 'checked' : '' }}><!-- 加上这个就是打开的状态checked -->
</script>

<!-- 网址链接列的templet -->
<script type="text/html" id="urlTpl">
    <a href="{{d.url}}" class="layui-table-link" target="_blank" onclick="isClose()">{{ d.url }}</a>
</script>


<script src="/js/jquery.min.js"></script>
<script src="/layui/layui.js"></script><!-- 需要首先加载 -->
<script src="/myjs/app.js?v=1.0.1"></script>
<script src="/js/util.js"></script>
<script>
    var eleTree;
    var table;
    var layer;
    var $;
    var form;
    var layer_folderTree;

    var searchTableDataObj;//保存请求到的文件夹数据,可用于搜索
    var parentDataArr;//请求到的原始数据

    var tableOption;//抽取table公共的配置项
    var tableIns;//表格实例
    var editLayer;//编辑弹窗id
    var addLayer;//添加弹窗id

    //输入框获得焦点
    window.onload=function() {
        $("#keywords").focus();
    }

    //判断是否是连续打开网址
    function isClose() {
        if($('.layui-form-switch').find('em').eq(0).html()=='OFF'){
            window.close()
        }
    }

    layui.use(['table','layer','form',"jquery"], function(){
        table = layui.table
        layer=layui.layer;
        layer_folderTree=layui.layer;//文件夹树显示层
        $ = layui.jquery;
        form=layui.form;

        //示范一个公告层
        <#if showNotice?? > ${showNotice} </#if>

        //绑定点击搜索
        $("#searchBtn").on("click",function () {
            var buff = $.extend(true,{},tableOption) //值赋值
            buff.url='/url/getUrlsLike';
            buff.where={keywords:$("#keywords")[0].value,searchType:$("#searchType")[0].value};
            buff.page={curr: 1};//从第一页开始
            tableIns = table.render(buff);
        })
        //绑定回车搜索
        $("#keywords").keydown(function(event){
            if(event.keyCode==13){
                $("#searchBtn").click();//调用点击事件
            }
        });

        //抽取公共的配置项
        tableOption={
            elem: '#demo'
            ,height: $(window).height()*0.85
            ,page: true //开启分页
            ,url:'/url/getUrlsLike'
            ,where:{keywords:'',searchType:0}
            ,skin: 'line' //行边框风格
            ,limits:[10,20,30]//分页的数量选择
            ,cols: [[ //表头
                {field: 'id', title: 'id', align:'center',hide:"true"}//隐藏id
                ,{field: 'label', title: '网址名称', align:'center',unresize:true,width:'25%'}
                ,{field: 'url', title: '网址链接',templet: '#urlTpl', align:'center',unresize:true,width:'25%'}
                ,{field: 'pidName', title: '文件夹' ,align:'center',unresize:true,width:'13%'}
                ,{field: 'createTime', title: '创建时间' ,align:'center',unresize:true,width:"18%"}
                ,{field:'isShare', title:'状态', templet: '#switchTpl',align:'center', unresize: true, width:"8%"}
                ,{fixed: 'handle',title: '操作', align:'center', toolbar: '#toolbarDemo',width:"11%"} //这里的toolbar值是模板元素的选择器
            ]],
        };


        //首次渲染表格,拿到对象
        tableIns = table.render(tableOption);//传入参数进行渲染


        //监听行内工具条
        table.on('tool(test)', function(obj){ //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
            var data = obj.data; //获得当前行数据
            var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）

            if(layEvent === 'delete'){ //删除
                //确认弹窗
                layer.confirm('您确定要删除该网址吗', {
                    btn: ['确定','取消'], //按钮
                    shadeClose: true,
                }, function(){
                    util.ajax("/url/delete",{id:obj.data.id,isShare:obj.data.isShare},function (data) {
                        if(data.code==0){
                            tableIns.reload(tableOption);//刷新表格
                            layer.msg("删除成功");
                        }
                    })
                }, function(){
                });

            } else if(layEvent === 'edit'){ //编辑
                //更改网址弹窗
                editLayer=layer.open({
                    type: 1,
                    shadeClose: true,
                    area: ['515px', '351px'], //宽高
                    content: $("#editText")
                });


                form.val("editText", {
                    "id": obj.data.id
                    ,"label": obj.data.label
                    ,"url": obj.data.url
                    ,"pidName": obj.data.pidName
                    ,"pid": obj.data.pid
                })
            }
        });

        //监听链接状态事件
        form.on('switch(isShare)', function(obj){
            var tds=$(obj.elem).closest("tr").find("td");

            var i=0;//递增使用

            var id=$(tds.get(0+i)).find("div").text();
            var label=$(tds.get(1+i)).find("div").text();
            var url=$(tds.get(2+i)).find("div a").text();
            var pidName=$(tds.get(3+i)).find("div").text();
            var creatTime=$(tds.get(4+i)).find("div").text();

            var url={
                id:id,
                url:url,
                label:label,
                pidName:pidName,
                time:creatTime,
                isShare:obj.elem.checked
            }
            //修改链接共享的状态
            util.ajax("/url/changeShareStatus",url,function (data) {
                layer.msg(data.message);
            })
        });

        //打开添加弹窗
        $("#addBtn").on("click",function () {
            //页面层
            addLayer=layer.open({
                type: 1,
                shadeClose: true,
                area: ['515px', '351px'], //宽高
                content: $("#addText")
            });

            //查询默认文件夹id
            util.ajax("/user/getRootFolderId",[],function (data) {
                //清空表单
                form.val("addText", {
                    "label": "",
                    "url": "",
                    "pidName": "默认文件夹",
                    "pid": data
                })
            })
        })

        //url添加事件
        form.on('submit(addSubmit)', function(data){
            util.ajax("/url/add",data.field,function (data) {
                tableIns.reload(tableOption);//刷新表格
                layer.close(addLayer);
                layer.msg("添加成功");

                //查询默认文件夹id
                util.ajax("/user/getRootFolderId",[],function (data) {
                    //清空表单
                    form.val("addText", {
                        "label": "",
                        "url": "",
                        "pidName": "默认文件夹",
                        "pid": data
                    })
                })
            })
            return false;
        });

        //url更改事件
        form.on('submit(editSubmit)', function(formData){

            util.ajax("/url/update",formData.field,function (data) {

                tableIns.reload(tableOption);//刷新表格

                layer.close(editLayer);
                layer.msg("更改成功");
            })
            return false;
        });

        //参数长度校验
        form.verify({
            label: [/^.{1,150}$/,'长度在1~150之间']

            //我们既支持上述函数式的方式，也支持下述数组的形式
            //数组的两个值分别代表：[正则匹配、匹配不符时的提示文字]
            ,myUrl: [/^.{1,500}$/,'长度在1~500之间']
        });

    });


</script>


<!-- url 添加 弹窗 -->
<div class="layui-form form-dialog" id="addText" lay-filter="addText">
    <div class="layui-row">
        <div class="layui-col-md11">
            <div class="layui-form-item">
                <label class="layui-form-label">网址名称</label>
                <div class="layui-input-block">
                    <input id="add1" lay-verify="label" type="text" name="label" placeholder="请输入网址名称" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">网址链接</label>
                <div class="layui-input-block">
                    <input id="add2" lay-verify="myUrl" type="text" name="url"  placeholder="请输入网址链接" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">文件夹</label>
                <div id="location_add" class="layui-input-block">
                    <input id="folderName_add" class="layui-input layui-input-inline selectTree" lay-verify="required" type="text" name="pidName" placeholder="请选择文件夹" readonly="readonly">
                    <button class="layui-btn layui-btn-primary selectTree" >选择</button>
                    <button class="layui-btn layui-btn-primary customFolderSetting">自定义</button>
                    <input id="folderId_add" class="layui-input hide" lay-verify="required" type="text" name="pid">

                </div>
            </div>
            <div class="layui-form-item" >
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="addSubmit">添加</button>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- url 编辑 弹窗 -->
<div class="layui-form form-dialog" lay-filter="editText" id="editText" >

    <div class="layui-row">
        <div class="layui-col-md11">
            <input class="layui-input hide" lay-verify="required" type="text" name="id" >
            <div class="layui-form-item">
                <label class="layui-form-label">网址名称</label>
                <div class="layui-input-block">
                    <input id="edit1" lay-verify="label" type="text" name="label" placeholder="请输入网址名称" autocomplete="off" class="layui-input">

            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">网址链接</label>
                <div class="layui-input-block">

<!-- 文件夹树弹窗 -->
<div id="folderTree" class="folderTree">
    <input id='searchFolder' type='text' autocomplete='off' placeholder='输入关键字进行文件夹过滤' class='layui-input' >
    <div id="ele" class="eleTree ele1 selectFoldertree" lay-filter="data"></div>

    <script>

        layui.use(["eleTree"], function() {
            eleTree = layui.eleTree;


            //绑定输入框搜索事件
            $("#searchFolder").on("input",function (e) {
                if($("#searchFolder").val()!=""){
                    var parentDataArrBuff=$.extend(true,[],parentDataArr)
                    var searchTableDataObjBuff=parentDataArrBuff[0];
                    filterTree(searchTableDataObjBuff,$("#searchFolder").val(),parentDataArrBuff,0);
                    el.reload(parentDataArrBuff);//重新渲染filter文件夹后的数据
                }else{
                    el.reload(parentDataArr);//重新渲染原始数据
                }
            })

            //打开文件夹树弹窗
            $(".selectTree").on("click",function () {
                el.reload();//每次打开都重新请求最新的数据和重新渲染

                folderTree_layer=layer_folderTree.open({
                    type: 1,
                    shadeClose: true,
                    area: ['515px', '351px'], //宽高]
                    content: $("#folderTree")
                });

                $("#searchFolder").val("");//清空数据
                $("#searchFolder").focus();//获取焦点

            })

            //请求自定义文件夹id
            $(".customFolderSetting").on("click",function () {
                util.ajax("/user/getCustomFolder",{},function (data) {
                    if(data.code==0){
                        $("#folderId_add").val(data.data.customFolderId);
                        $("#folderName_add").val(data.data.customFolderName);
                        $("#folderId_edit").val(data.data.customFolderId);
                        $("#folderName_edit").val(data.data.customFolderName);
                    }else{
                        layer.msg(data.message);
                    }
                })
            })

            //请求数据,初始化
            el = eleTree.render({
                elem: '#ele',
                url: '/folder/query',//请求数据的url
                expandOnClickNode: false,//点击节点前的图标才收缩
                defaultExpandAll:true,//默认展开所有节点
                done: function(res){
                    var buff=buildTree(res);//转化成树结构
                    searchTableDataObj=buff[0];
                    parentDataArr=buff;
                    return buff;//将平面数据转换成tree数据,返回给data
                }
            });


            eleTree.on("nodeClick(data)", function (d) {
                clickNodeId=d.data.currentData.value;
                $("#folderId_add").val(clickNodeId);
                $("#folderName_add").val(d.data.currentData.label);
                $("#folderId_edit").val(clickNodeId);
                $("#folderName_edit").val(d.data.currentData.label);
                layer_folderTree.close(folderTree_layer);
            });

            //过滤文件夹
            function filterTree(data,keyword,parentData,index) {
                if(data.children==undefined){
                    if(data.label.indexOf(keyword) == -1){//不包含,则删除自身
                        parentData.splice(index,1);
                    }
                    return;
                }

                for(var i=data.children.length-1;i>=0;i--){
                    filterTree(data.children[i],keyword,data.children,i);
                }

                if(data.children.length==0){
                    if(data.label.indexOf(keyword) == -1){//自身不包含,删除自身
                        parentData.splice(index,1);
                    }else{
                        delete data["children"];//自身包含,则删除children字段
                    }
                }
            }

        })


    </script>
</div>
