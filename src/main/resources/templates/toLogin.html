<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title>72cun 网址收藏</title>
    <link rel="stylesheet" type="text/css" href="https://www.usetools.cn/layui/css/layui.css" />
    <link rel="stylesheet" type="text/css" href="https://www.usetools.cn/css/login.css" />

</head>

<body>
<div class="m-login-bg">
    <div class="m-login">
        <h3>72cun 网址收藏</h3>
        <form class="m-login-warp layui-form" action="${loginUrl!'/login?type=main'}" method="post">

            <input name="url" style="display: none" value="${url!}">
            <input name="title" style="display: none" value="${title!}">

            <div class="layui-form-item">
                <label class="layui-form-label">账号</label>
                <div class="layui-input-block">
                    <input type="text" id="userName" lay-verify="myUserName" name="userName" placeholder="手机号/用户名" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">密码</label>
                <div class="layui-input-block">
                    <input type="password" id="password"  lay-verify="myPassword" name="password"  placeholder="" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item" style="margin-top: 60px;text-align: center">
                    <button class="layui-btn" lay-submit lay-filter="loginSubmit" id="login">登入</button>
                    <a href="/" class="layui-btn">返回</a>
            </div>

        </form>

        <div style="text-align: center;margin-top: 10px">
            <a href="/html/forgetPassword.html" style="font-size: 10px">忘记密码</a>
            <span>|</span>
            <a href="/html/register.html" style="font-size: 10px">注册账号</a>
            <span>|</span>
            <a href="/html/quickStart.html" style="font-size: 10px">功能预览</a>
        </div>

    </div>
</div>

<script src="https://www.usetools.cn/layui/layui.js"></script><!-- 需要首先加载 -->
<script src="/myjs/app.js?v=1.0.0"></script>
<script src="https://www.usetools.cn/js/jquery.min.js"></script>
<script>
    layui.use(['layer','form'], function() {
        var layer = layui.layer;
        var form = layui.form;

        form.verify({
            myUserName: [/^.{1,20}$/,'长度在1~20之间']
            ,myPassword: [/^.{1,20}$/,'长度在1~20之间']
        });

        //注册事件
        form.on('submit(loginSubmit)', function(formData){
        });

        //回车执行登入操作
        $(document).bind('keyup',function (event) {
            if (event.keyCode == "13") {
                $('#login').click();
            }
        })

    });
</script>
</body>

</html>
