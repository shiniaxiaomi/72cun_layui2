<script>

    //动态添加数据
    function addData(url,param,next) {
        util.ajax(url,param,function (data) {

            var o = document.getElementById("LAY_demo1");
            var width = o.offsetWidth-200; //div的宽度

            var lis = [];
            var list=data.data;
            for(var i = 0; i < list.length; i++){
                lis.push(`
                                <a href="javascript:;" class="media-left"><img src="/images/code.png" height="46px" width="46px"></a>
                                <div class="media-body">
                                    <div class="pad-btm">
                                        <p class="fontColo "><a target="_blank" href="/home/`+userName+`"><b>`+userName+`</b></a><span>共享了一个链接</span></p>
                                        <p>`+list[i].createTime+`</p>
                                    </div>
                                    <b><p style="font-size: 15px">标题：<span><a href="`+list[i].url+`" target="_blank"><span onclick="urlClick()">`+list[i].label+`</span></a></span></p></b>
                                    <p>位置：<span>`+list[i].pidName+`</span></p>
                                    <div class="longtext" style="width:`+width+`px;">链接：<a href="`+list[i].url+`" target="_blank"><span onclick="urlClick()">`+list[i].url+`</span></a></div>

                                    <div class="media">
                                        <div class="media-right">

                                            <ul class="list-inline">
                                                <li><span>点击量：</span><span>107</span></li>
                                                <li><span>点赞量：</span><span>107</span></li>
                                                <li onclick="goodClick(this)"><i class="layui-icon layui-icon-praise" style="font-size: 25px;" onmousemove="$(this).css('color','#1E9FFF')" onmouseout="$(this).css('color','')"></i></li>
                                            </ul>

                                        </div>
                                        <!--<div class="media-left"></div>-->
                                    </div>
                                </div>
                                <hr>
                        `)
            }

            //执行下一页渲染，第二参数为：满足“加载更多”的条件，即后面仍有分页
            //pages为Ajax返回的总页数，只有当前页小于总页数的情况下，才会继续出现加载更多
            next(lis.join(''), param.page < data.pages); //假设总页数为 10
        })
    }

    //访问链接的点击事件
    function urlClick() {
        console.log(22222222);
    }

    //点赞的点击事件
    function goodClick(arg) {
        var li=$(arg).closest("ul").find("li").get(1);
        var span=$(li).find("span").get(1);
        $(span).text(Number($(span).text())+1);
    }

    var userName=undefined;
    <#if user??>
        userName="${user.userName}";
    </#if>


    layui.use(['flow','util','element'], function() {
        var flow = layui.flow;
        var utils = layui.util;

        //输入框获得焦点
        window.onload=function() {
            $("#keywords").focus();
        }

        //返回页面最上方
        utils.fixbar({
            showHeight:200,
        });

        //使用ajax请求登入页面(静态资源)
        $("#login").click(function () {
            $.ajax({
                url:"/html/index.html",
                type:'get',
                complete:function (data) {
                    if(data.responseJSON!=undefined && data.responseJSON.code==1){
                        layer.msg(data.responseJSON.message, {offset: '50px', anim: 0});
                    }else if(data.responseText!=undefined){
                        document.write(data.responseText);
                        document.close()
                    }
                },
            })
        })

        //绑定回车搜索
        $("#keywords").keyup(function(event){
            if(event.keyCode==13){
//                $("#LAY_demo1").empty();
//                flow.load({
//                    elem: '#LAY_demo1', //流加载容器
//                    isAuto: false,
//                    done: function(page, next){ //执行下一页的回调
//                        addData("/home/getShareUrlsLike",{userId:userId,page:page,keywords:$("#keywords")[0].value},next);
//                    }
//                });
                window.open("http://localhost:8087/html/homePageSearch.html?search="+encodeURI($("#keywords")[0].value+"&userName="+userName) , "_blank");
                $('#keywords').val('');//清空搜索框
            }
        });

//        flow.load({
//            elem: '#LAY_demo1', //流加载容器
//            isAuto: false,
//            done: function(page, next){ //执行下一页的回调
//                addData("/home/getShareUrlsLike",{userId:userId,page:page,keywords:$("#keywords")[0].value},next);
//            }
//        });
    })
