<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>${userName!''}的主页</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="https://www.usetools.cn/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="https://www.usetools.cn/layui/style/admin.css" media="all">
    <link rel="stylesheet" href="https://www.usetools.cn/layui/style/template.css" media="all">
    <link rel="stylesheet" href="https://www.usetools.cn/css/global.css" media="all">

    <!-- 最后一个加载 -->
    <link rel="stylesheet" href="https://www.usetools.cn/css/myStyle.css" media="all">
    <link rel="stylesheet" href="https://www.usetools.cn/css/urlStyle.css" media="all">

</head>

<body>

<!-- 菜单栏 -->
<#include "/common/header.html" />

<div class="layui-container" >
    <div class="layui-fluid layadmin-homepage-fluid">
    <div class="layui-row layui-col-space8">
        <div class="layui-col-md2">
            <div class="layadmin-homepage-panel layadmin-homepage-shadow" style="min-height:500px">
                <div class="layui-card text-center">
                    <div class="layui-card-body">
                        <div class="layadmin-homepage-pad-ver">
                            <img class="layadmin-homepage-pad-img" src="https://www.usetools.cn/images/code.png" width="96" height="96">
                        </div>
                        <h4 class="layadmin-homepage-font">${userName!}</h4>
                        <div class="layadmin-homepage-pad-ver">
                            <a href="javascript:;" class="layui-icon layui-icon-cellphone" title="1111111111"></a>
                            <a href="javascript:;" class="layui-icon layui-icon-login-wechat" title="1111111111"></a>
                            <a href="javascript:;" class="layui-icon layui-icon-login-qq" title="1111111111"></a>
                        </div>
                        <button class="layui-btn layui-btn-fluid">关注</button>
                    </div>
                </div>
                <p class="layadmin-homepage-about">关于我</p>
                <div class="layadmin-homepage-pad-hor">
                    <mdall>作者很懒！</mdall>
                </div>
            </div>
        </div>
        <div class="layui-col-md10">
            <div class="layui-fluid layadmin-homepage-content">
                <div class="layui-row layui-col-space20 layadmin-homepage-list-imgtxt">
                    <div class="layui-col-md9">

                        <!-- 搜索框 -->
                        <input type="text" name="title" id="keywords_psersonal" placeholder="搜个人共享链接" autocomplete="off" class="layui-input" style="margin-bottom: 10px">

                        <div class="grid-demo">
                            <div class="panel-body layadmin-homepage-shadow">
                                <main>
                                    <div class="flow-default" id="LAY_demo1">
                                        <!--动态生成-->
                                    </div>
                                </main>
                            </div>
                        </div>

                    </div>
                    <div class="layui-col-md3">
                        <div class="grid-demo layui-card homepage-bottom">
                            <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
                                <ul class="layui-tab-title" style="text-align: center">
                                    <li class="layui-this">分享达人</li>
                                    <li>获赞达人</li>
                                    <li>随机用户</li>
                                </ul>
                                <div class="layui-tab-content">
                                    <div class="layui-tab-item layui-show layui-card-body">
                                        <div class="flow-default" id="shareUser">
                                            <!--动态生成-->
                                        </div>
                                    </div>
                                    <div class="layui-tab-item layui-card-body">
                                        <div id="goodUser">
                                            <!-- 动态生成点赞排行榜 -->
                                        </div>
                                    </div>
                                    <div class="layui-tab-item layui-card-body">
                                        <div id="randomUser">
                                            <!-- 动态生成随机用户 -->
                                            待开发。。。。。
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script src="https://www.usetools.cn/layui/layui.js"></script><!-- 需要首先加载 -->
<script src="/myjs/app.js?v=1.0.1"></script><!-- 不缓存 -->
<script src="https://www.usetools.cn/js/jquery.min.js"></script>
<script>

    var userId=${userId!''}

    layui.use(['layer','homePageJs'], function() {
        var layer = layui.layer;
        var homePageJs=layui.homePageJs;

        //示范一个公告层
        <#if showNotice?? > ${showNotice} </#if>

        homePageJs.init();

        //刚进来的时候初始化，按回车之后重新搜索
        homePageJs.loadUrlDataByFlow("LAY_demo1","/home/getShareUrlsLike",{userId:userId,keywords:$("#keywords_psersonal")[0].value});//热帖

        $("#keywords_psersonal").focus();

        //绑定回车搜索
        $("#keywords_psersonal").keyup(function(event){
            if(event.keyCode==13){
                $("#LAY_demo1").empty();
                homePageJs.loadUrlDataByFlow("LAY_demo1","/home/getShareUrlsLike",{userId:userId,keywords:$("#keywords_psersonal")[0].value});//热帖
            }
        });

        //绑定回车搜索
        $("#keywords").keyup(function(event){
            if(event.keyCode==13){
                window.location.href="/html/homePageSearch.html?search="+encodeURI($("#keywords")[0].value);
                $('#keywords').val('');//清空搜索框
            }
        });

    })
</script>
</body>
</html>
