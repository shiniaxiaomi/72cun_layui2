<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>${userName!''}的主页</title>

    <link rel="stylesheet" href="/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="/layui/style/admin.css" media="all">
    <link rel="stylesheet" href="/layui/style/template.css" media="all">
    <link rel="stylesheet" href="/css/global.css" media="all">

    <!-- 最后一个加载 -->
    <link rel="stylesheet" href="/css/myStyle.css" media="all">

</head>

<body>

<div class="menu-header">
    <ul>
        <img src="/images/logo.png" style="float: left;margin-top: 5px;margin-left: 300px">

        <li><a href="/" style="margin-left: 100px">首页</a></li>

        <li><a href="/main?home">后台管理</a></li>
        <li><a href="/html/quickStart.html" target="_blank">功能预览</a></li>
        <li><a href="javascript:;">留言建议</a></li>

        <div id="userDiv">
            <li style="float:right"><a href="/html/register.html" id="">注册</a></li>
            <li style="float:right"><a href="javascript:;" id="login">登入</a></li>
        </div>
    </ul>
</div>


<div class="layui-fluid layadmin-homepage-fluid">
    <div class="layui-row layui-col-space8">
        <div class="layui-col-md2">
            <div class="layadmin-homepage-panel layadmin-homepage-shadow" style="min-height:500px">
                <div class="layui-card text-center">
                    <div class="layui-card-body">
                        <div class="layadmin-homepage-pad-ver">
                            <img class="layadmin-homepage-pad-img" src="/images/code.png" width="96" height="96">
                        </div>
                        <h4 class="layadmin-homepage-font">${userName!}</h4>
                        <div class="layadmin-homepage-pad-ver">
                            <a href="javascript:;" class="layui-icon layui-icon-cellphone" title="1111111111"></a>
                            <a href="javascript:;" class="layui-icon layui-icon-login-wechat" title="1111111111"></a>
                            <a href="javascript:;" class="layui-icon layui-icon-login-qq" title="1111111111"></a>
                        </div>
                        <button class="layui-btn layui-btn-fluid">关注</button>
                    </div>
                </div>
                <p class="layadmin-homepage-about">关于我</p>
                <div class="layadmin-homepage-pad-hor">
                    <mdall>作者很懒！</mdall>
                </div>
            </div>
        </div>
        <div class="layui-col-md10">
            <div class="layui-fluid layadmin-homepage-content">
                <div class="layui-row layui-col-space20 layadmin-homepage-list-imgtxt">
                    <div class="layui-col-md9">

                        <!-- 搜索框 -->
                        <input type="text" name="title" id="keywords" placeholder="搜个人共享链接" autocomplete="off" class="layui-input" style="margin-bottom: 10px">

                        <div class="grid-demo">
                            <div class="panel-body layadmin-homepage-shadow">
                                <div class="flow-default" id="LAY_demo1">
                                    <!--动态生成-->
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="layui-col-md3">
                        <div class="grid-demo layui-card homepage-bottom">
                            <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
                                <ul class="layui-tab-title" style="text-align: center">
                                    <li class="layui-this">分享达人</li>
                                    <li>获赞达人</li>
                                    <li>随机用户</li>
                                </ul>
                                <div class="layui-tab-content">
                                    <div class="layui-tab-item layui-show layui-card-body">
                                        <div class="flow-default" id="shareUser">
                                            <!--动态生成-->
                                        </div>
                                    </div>
                                    <div class="layui-tab-item layui-card-body">
                                        <div id="goodUser">
                                            <!-- 动态生成点赞排行榜 -->
                                        </div>
                                    </div>
                                    <div class="layui-tab-item layui-card-body">
                                        <div id="randomUser">
                                            <!-- 动态生成随机用户 -->
                                            待开发。。。。。
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="/js/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/js/util.js"></script>
<script src="/myjs/app.js?v=1.0.1"></script><!-- 自己定义的模块 -->
<script>

    var userId=${userId!''}

    layui.use(['layer','homePageJs'], function() {
        var layer = layui.layer;
        var homePageJs=layui.homePageJs;

        //示范一个公告层
        <#if showNotice?? > ${showNotice} </#if>

        homePageJs.init();

        //刚进来的时候初始化，按回车之后重新搜索
        homePageJs.loadUrlDataByFlow("LAY_demo1","/home/getShareUrlsLike",{userId:userId,keywords:$("#keywords")[0].value});//热帖

        //绑定回车搜索
        $("#keywords").keyup(function(event){
            if(event.keyCode==13){
                $("#LAY_demo1").empty();
                homePageJs.loadUrlDataByFlow("LAY_demo1","/home/getShareUrlsLike",{userId:userId,keywords:$("#keywords")[0].value});//热帖
            }
        });

    })
</script>
</body>
</html>

<!-- url 添加 弹窗 -->
<div class="layui-form form-dialog" id="loginDiv" lay-filter="loginDiv" style="display: none;">
    <div class="layui-row">
        <div class="layui-col-md11">
            <div class="layui-form-item" style="margin-top: 10px">
                <label class="layui-form-label" style="padding: 9px 0px;">账号</label>
                <div class="layui-input-block">
                    <input type="text" id="userName" lay-verify="myUserName"  name="userName" placeholder="手机号/用户名" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label"  style="padding: 9px 0px;">密码</label>
                <div class="layui-input-block">
                    <input type="password" id="password" lay-verify="myPassword" name="password"   autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item" >
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="loginSubmit">登入</button>
                </div>
            </div>
        </div>

    </div>

</div>
