<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>系统消息</title>

    <link rel="stylesheet" href="http://www.usetools.cn/layui/css/layui.css">


    <style type="text/css">
        .talk_show{
            width:580px;
            height:420px;
            border:1px solid #666;
            background:#fff;
            margin:10px auto 0;
            overflow:auto;
        }
        .talk_input{
            width:580px;
            margin:10px auto 0;
        }
        .talk_word{
            width:420px;
            height:26px;
            padding:0px;
            float:left;
            margin-left:10px;
            outline:none;
            text-indent:10px;
        }
        .talk_sub{
            width:56px;
            height:30px;
            float:left;
            margin-left:10px;
        }
        .atalk{
            margin:10px;
        }
        .atalk span{
            display:inline-block;
            background:#0181cc;
            border-radius:10px;
            color:#fff;
            padding:5px 10px;
        }
        .btalk{
            margin:10px;
            text-align:right;
        }
        .btalk span{
            display:inline-block;
            background:#ef8201;
            border-radius:10px;
            color:#fff;
            padding:5px 10px;
        }
        /* 时间 */
        dt {
            padding-top: .3rem;
            padding-bottom: .3rem;
            padding-left: .6rem;
            padding-right: .6rem;
            border-radius: .2rem;
            color: white;
            background-color: #D4D4D4;
            display: inline-block;
            margin-left: 50%;
            margin-top: 2rem;
            margin-bottom: 1rem;
            transform: translateX(-50%);
        }
    </style>

</head>
<body>

    <div class="layui-container">
        <div class="layui-row" class="talk_show" id="words" style="width:80%;overflow: auto;margin:0 auto;">
            <#list messages as message>
                <dt>${message.sendTime?string('yyyy-MM-dd hh:mm:ss')}</dt>
                <#if message.userName == user.userName>
                    <div class="btalk">${user.userName} : <span id="bsay">${message.detail}</span></div>
                <#else>
                    <div class="atalk">管理员 : <span id="asay">${message.detail}</span></div>
                </#if>
            </#list>
        </div>
        <div class="layui-row" style="text-align: center">
            <form id="form" class="layui-form" action="">
                <div class="layui-inline layui-form-text">
                    <label class="layui-form-label">回复消息</label>
                    <div class="layui-input-inline" style="width: 500px">
                        <input type="text" lay-verify="required" name="detail" placeholder="" autocomplete="off" class="layui-input">
                    </div>
                    <button class="layui-btn layui-btn-primary" lay-submit lay-filter="formDemo">提交</button>
                    <a class="layui-btn layui-btn-primary" href="javascript:history.go(-1)">返回</a>
                    <button style="display: none" id="reset" type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
            </form>
        </div>


    </div>

</body>

<script src="http://www.usetools.cn/js/jquery.min.js"></script>
<script src="http://www.usetools.cn/layui/layui.js" charset="utf-8"></script>
<script src="http://www.usetools.cn/js/util.js"></script>

<script>

    var Words = document.getElementById("words");

    layui.use(['form','table'], function(){

        var form = layui.form;

        //初始化
        $("#words").height($(window).height()*0.80);//设置div高度为窗口大小的80%
        Words.scrollTop = Words.scrollHeight;//将滚动条滚动到最末端

        //监听反馈主题的提交
        form.on('submit(formDemo)', function(data){
            data.field.rootId=${rootId};//设置这条消息的根节点

            //发送消息
            util.ajax("/message/send",data.field,function (data2) {
                if(data2.code==0){
                    layer.msg(data2.message, {offset: '50px', anim: 0});
                    var str = '<dt>'+getNowFormatDate()+'</dt> <div class="btalk">${user.userName} : <span>' + data.field.detail +'</span></div>';
                    Words.innerHTML = Words.innerHTML + str;
                    Words.scrollTop = Words.scrollHeight;//将滚动条滚动到最末端
                    $("#reset").click();//清空表单
                }else{
                    layer.msg(data2.message, {offset: '50px', anim: 0});
                }
            })

            return false;
        });

    });

    //获取当前时间
    function getNowFormatDate() {
        var date = new Date();
        var seperator1 = "-";
        var seperator2 = ":";
        var month = date.getMonth() + 1;
        var strDate = date.getDate();
        if (month >= 1 && month <= 9) {
            month = "0" + month;
        }
        if (strDate >= 0 && strDate <= 9) {
            strDate = "0" + strDate;
        }

        var seconds=date.getSeconds()<=9?"0"+date.getSeconds():date.getSeconds();

        var currentdate = date.getFullYear() + seperator1 + month + seperator1 + strDate
            + " " + date.getHours() + seperator2 + date.getMinutes()
            + seperator2 + seconds;
        return currentdate;
    }

</script>



</html>
