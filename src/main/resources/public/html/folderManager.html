<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="https://www.usetools.cn/layui/css/layui.css">

    <link rel="stylesheet" href="https://www.usetools.cn/css/eleTree.css" media="all">

    <style>
        /*设定表格特定的字体大小*/
        .layui-table-cell {
            font-size: 16px;
        }
        .form-dialog,.hide{
            display: none;
        }
        .folderTree{
            height: 320px;
            display: none
        }
        .selectFoldertree{
            height: 255px;
        }
    </style>

</head>
<body>
<div class="layui-row">
    <div class="layui-col-md2">
        <div>
            <input id='searchFolder_left' type='text' autocomplete='off' placeholder='输入关键字进行过滤' class='layui-input' >
            <div id="ele_left" class="eleTree ele1" lay-filter="data1"></div>
        </div>
    </div>

    <div class="layui-col-md10">
        <div>
            <label class="layui-form-label" style="font-size: 20px">批量操作</label>
            <div class="layui-btn-container">
                <button class="layui-btn" id="moveToBtn">移动到</button>
                <button class="layui-btn" id="deleteBtn">删除</button>
            </div>
        </div>

        <table id="demo" lay-filter="test"></table>
    </div>

</div>

</body>
</html>

<!-- 工具栏模板： -->
<script type="text/html" id="toolbarDemo" lay-event="tool">
    <button class="layui-btn layui-btn-primary layui-btn-sm" lay-event="edit">编辑</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" lay-event="delete">删除</button>
</script>

<!-- 链接状态模板： -->
<script type="text/html" id="switchTpl">
    <input type="checkbox" name="isShare" lay-skin="switch" lay-text="共享|私有" lay-filter="isShare" {{ d.isShare == true ? 'checked' : '' }}><!-- 加上这个就是打开的状态checked -->
</script>

<!-- 网址链接列的templet -->
<script type="text/html" id="urlTpl">
    <a href="{{d.url}}" class="layui-table-link" target="_blank">{{ d.url }}</a>
</script>

<script src="https://www.usetools.cn/layui/layui.js"></script><!-- 需要首先加载 -->
<script src="/myjs/app.js?v=1.0.0"></script>
<script src="https://www.usetools.cn/js/jquery.min.js"></script>
<script>

    var eleTree;//文件夹树工厂,产生实例
    var layer_folderTree;//文件夹树显示层
    var table;
    var $;
    var form;

    var searchTableDataObj;//保存请求到的文件夹数据,可用于搜索
    var parentDataArr;//请求到的原始数据

    var folderTree_layer;//树弹窗id
    var el_left;//左侧文件夹树实例
    var el;//其他文件夹树实例
    var tableOption;//抽取table公共的配置项
    var clickNodeId;//保存点击过的node的id
    var tableIns;//表格实例
    var editLayer;//编辑弹窗id
    var moveLayer;//编辑弹窗id
    var beforeMoveFolderId;//点击批量移动前的文件夹id

    layui.use(['jquery','layer', 'table','eleTree','form','myUtil'], function () {
        eleTree = layui.eleTree;
        table = layui.table;
        $ = layui.$;
        layer_folderTree=layui.layer;//文件夹树显示层
        layer=layui.layer;
        form = layui.form;
        myUtil = layui.myUtil;

        //打开批量移动到弹窗
        $("#moveToBtn").on("click",function () {

            beforeMoveFolderId=clickNodeId;//保存批量移动前的文件夹id

            if(table.checkStatus('idTest').data.length==0){
                layer.msg("请选中数据!");
                return;
            }

            //批量更改网址
            moveLayer=layer.open({
                type: 1,
                shadeClose: true,
                area: ['515px', '351px'], //宽高
                content: $("#moveText")
            });


            form.val("moveText", {
                "pidName": ""
            })
        })

        //批量删除事件
        $("#deleteBtn").on("click",function () {
            //确认弹窗
            layer.confirm('您确定要批量删除吗', {
                btn: ['确定','取消'], //按钮
                shadeClose: true,
            }, function(){

                var checkStatus = table.checkStatus('idTest')
                var data = checkStatus.data;

                var id="";
                var isShare="";
                for(var i=0;i<data.length;i++){id+=data[i].id+",";isShare+=data[i].isShare+",";}
                myUtil.ajax("/url/deleteInBatches",{id:id,isShare:isShare},function (data) {
                    if(data.code==0){
                        tableOption.where={pid:clickNodeId};
                        tableIns.reload(tableOption);//刷新表格
                        layer.msg("批量删除成功");
                    }
                })

            }, function(){
            });
        })

        //绑定输入框搜索事件
        $("#searchFolder_left").on("input",function (e) {
            if($("#searchFolder_left").val()!=""){
                var parentDataArrBuff=$.extend(true,[],parentDataArr)
                var searchTableDataObjBuff=parentDataArrBuff[0];
                filterTree(searchTableDataObjBuff,$("#searchFolder_left").val(),parentDataArrBuff,0);
                el_left.reload(parentDataArrBuff);//重新渲染filter文件夹后的数据
            }else{
                el_left.reload(parentDataArr);//重新渲染原始数据
            }
        })

        //过滤文件夹
        function filterTree(data,keyword,parentData,index) {
            if(data.children==undefined){
                if(data.label.indexOf(keyword) == -1){//不包含,则删除自身
                    parentData.splice(index,1);
                }
                return;
            }

            for(var i=data.children.length-1;i>=0;i--){
                filterTree(data.children[i],keyword,data.children,i);
            }

            if(data.children.length==0){
                if(data.label.indexOf(keyword) == -1){//自身不包含,删除自身
                    parentData.splice(index,1);
                }else{
                    delete data["children"];//自身包含,则删除children字段
                }
            }
        }

//###########################################树

        //请求数据,初始化
        el_left = eleTree.render({
            elem: '#ele_left',
            url: '/folder/query',//请求数据的url
            draggable:true,//是否开启拖拽
            contextmenuList:["add","edit","remove","setting"],//节点的操作
            expandOnClickNode: false,//点击节点前的图标才收缩
            defaultExpandAll:true,//默认展开所有节点
            done: function(res){
                var buff=myUtil.buildTree(res);//转化成树结构
                searchTableDataObj=buff[0];
                parentDataArr=buff;
                return buff;//将平面数据转换成tree数据,返回给data
            }
        });

        // 添加子节点事件之前
        eleTree.on("nodeAppend(data1)", function (d) {
            layer.prompt({title: '请输入文件夹名称', formType: 0,maxlength: 15,shadeClose: true}, function(pass, index){
                myUtil.ajax("/folder/addFolder",{name:pass,pid:d.data.value},function (data) {
                    if(data.code==0){
                        d.setData({//设置数据
                            value:data.data.id,
                            pid: d.data.value,
                            label: pass,
                        });

                        layer.close(index);
                        layer.msg('文件夹添加成功');
                    }else{
                        layer.close(index);
                        layer.msg('文件夹添加失败');
                    }
                })
            });

        });

        // 节点被编辑事件之前(检查编译后的名称和检验后台是否修改成功)
        eleTree.on("nodeEdit(data1)", function (d) {
            myUtil.ajax("/folder/update",{name:d.value,id:d.data.value},function (data) {
                if(data.code==0){
                    layer.msg('文件夹名称更改成功');
                    d.update();//更新页面数据
                }else{
                    layer.msg('文件夹名称更改失败');
                }
            })
        });

        // 节点被拖拽事件之前
        eleTree.on("nodeDrag(data1)", function (d) {
            if(d.target.data.currentData==undefined){
                return;
            }
            //返回原来的节点,则返回
            if(d.current.data.currentData.pid==d.target.data.currentData.value){
                return;
            }
            myUtil.ajax("/folder/update",{id:d.current.data.currentData.value,pid:d.target.data.currentData.value},function (data) {
                if(data.code==0){
                    layer.msg('文件夹更改成功');
                    d.move();//成功之后页面上才移动
                }else{
                    layer.msg('文件夹更改失败');
                    el_left.reload();//发生错误时,重新加载
                }
            })
        });

        // 节点被删除事件
        eleTree.on("nodeRemove(data1)",function(d) {
            //确认弹窗
            layer.confirm('您确定要删除该文件夹和该文件夹下的所有网址吗', {
                btn: ['确定','取消'], //按钮
                shadeClose: true,
            }, function(){

                myUtil.ajax("/folder/delete",{id:d.data.value,pid:d.data.pid},function (data) {
                    if(data.code==0){
                        layer.msg('删除成功');
                        d.deleteNode();//删除该节点
                        tableIns.reload(tableOption);//刷新表格
                    }else{
                        layer.msg(data.message);
                        el_left.reload();//发生错误时,重新加载
                    }
                })

            }, function(){
            });

        })

        // 节点被点击事件
        eleTree.on("nodeClick(data1)", function (d) {
            clickNodeId=d.data.currentData.value;
            tableIns.reload({
                where: { //设定异步数据接口的额外参数，任意设
                    pid:clickNodeId
                }
                ,page: {
                    curr: 1 //重新从第 1 页开始
                }
            });

        });

        // 节点被自定义事件
        eleTree.on("nodeSetting(data1)", function (d) {
            clickNodeId=d.data.value;

            myUtil.ajax("/user/updateCustomFolder",{customFolderId:clickNodeId,customFolderName:d.data.label},function (data) {
                layer.msg(data.message);
            })
        });

//######################################################表格

        tableOption={
            elem: '#demo'
            ,id:'idTest'
            ,height: $(window).height()*0.85
            ,url: '/url/getUrlsByPid' //数据接口
            ,where:{pid:-1}
            ,page: true //开启分页
            ,skin: 'line' //行边框风格
            ,limits:[10,20,30]//分页的数量选择
            ,cols: [[ //表头
                {type:'checkbox',width:"5%"},
                {field: 'id', title: 'id', align:'center',hide:"true"}//隐藏id
                ,{field: 'label', title: '网址名称', align:'center',unresize:true,width:'25%'}
                ,{field: 'url', title: '网址链接',templet: '#urlTpl', align:'center',unresize:true,width:'20%'}
                ,{field: 'pidName', title: '文件夹' ,align:'center',unresize:true,width:'11%'}
                ,{field: 'createTime', title: '创建时间' ,align:'center',unresize:true,width:"17%"}
                ,{field:'isShare', title:'状态', templet: '#switchTpl',align:'center', unresize: true, width:"9%"}
                ,{fixed: 'handle',title: '操作', align:'center', toolbar: '#toolbarDemo',width:"13%"} //这里的toolbar值是模板元素的选择器
            ]],
        }

        //首次渲染,拿到对象
        tableIns = table.render(tableOption);

        //监听行内工具条
        table.on('tool(test)', function(obj){ //注：tool是工具条事件名，test是table原始容器的属性 lay-filter="对应的值"
            var data = obj.data; //获得当前行数据
            var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）

            if(layEvent === 'delete'){ //删除
                //确认弹窗
                layer.confirm('您确定要删除该网址吗', {
                    btn: ['确定','取消'], //按钮
                    shadeClose: true,
                }, function(){
                    myUtil.ajax("/url/delete",{id:obj.data.id,isShare:obj.data.isShare},function (data) {
                        if(data.code==0){
                            tableOption.where={pid:clickNodeId};
                            tableIns.reload(tableOption);//刷新表格
                            layer.msg(data.message);
                        }
                    })
                }, function(){
                });

            } else if(layEvent === 'edit'){ //编辑

                beforeMoveFolderId=clickNodeId;//保存批量移动前的文件夹id

                //更改网址弹窗
                editLayer=layer.open({
                    type: 1,
                    shadeClose: true,
                    area: ['515px', '351px'], //宽高
                    content: $("#editText")
                });

                form.val("editText", {
                    "id": obj.data.id
                    ,"label": obj.data.label
                    ,"url": obj.data.url
                    ,"pidName": obj.data.pidName
                    ,"pid": obj.data.pid
                })
            }
        });

        //监听链接状态事件
        form.on('switch(isShare)', function(obj){
            var tds=$(obj.elem).closest("tr").find("td");

            var i=1;

            var id=$(tds.get(0+i)).find("div").text();
            var label=$(tds.get(1+i)).find("div").text();
            var url=$(tds.get(2+i)).find("div a").text();
            var pidName=$(tds.get(3+i)).find("div").text();
            var creatTime=$(tds.get(4+i)).find("div").text();

            var url={
                id:id,
                url:url,
                label:label,
                pidName:pidName,
                time:creatTime,
                isShare:obj.elem.checked
            }

            //修改链接共享的状态
            myUtil.ajax("/url/changeShareStatus",url,function (data) {
                layer.msg(data.message);
            })
        });


        //设置单击行选中复选框
        $(document).on("click",".layui-table-body table.layui-table tbody tr",function(){
            var obj = event ? event.target : event.srcElement;
            var tag = obj.tagName;
            var checkbox = $(this).find("td div.laytable-cell-checkbox div.layui-form-checkbox I");
            if(checkbox.length!=0){
                if(tag == 'DIV') {
                    checkbox.click();
                }
            }
        });
        $(document).on("click","td div.laytable-cell-checkbox div.layui-form-checkbox",function(e){
            e.stopPropagation();
        });


        //url更改事件
        form.on('submit(editSubmit)', function(formData){
            myUtil.ajax("/url/update",formData.field,function (data) {
                tableOption.where={pid:beforeMoveFolderId};//展示批量移动前的文件夹
                tableIns.reload(tableOption);//刷新表格
                clickNodeId=beforeMoveFolderId;//重新法赋值文件夹id

                layer.close(editLayer);
                layer.msg(data.message);

            })
            return false;
        });

        //url批量移动事件
        form.on('submit(moveSubmit)', function(formData){
            var checkStatus = table.checkStatus('idTest')
            var data = checkStatus.data;

            var id="";
            for(var i=0;i<data.length;i++){
                id+=data[i].id+",";
            }

            myUtil.ajax("/url/updateInBatches",{pid:formData.field.pid,id:id,pidName:formData.field.pidName},function (data) {
                if(data.code==0){
                    tableOption.where={pid:beforeMoveFolderId};//展示批量移动前的文件夹
                    tableIns.reload(tableOption);//刷新表格
                    clickNodeId=beforeMoveFolderId;//重新法赋值文件夹id

                    layer.close(moveLayer);
                    layer.msg("更改成功");
                }
            })

            return false;
        });


        //参数长度校验
        form.verify({
            label: [/^.{1,150}$/,'长度在1~150之间']

            //我们既支持上述函数式的方式，也支持下述数组的形式
            //数组的两个值分别代表：[正则匹配、匹配不符时的提示文字]
            ,myUrl: [/^.{1,500}$/,'长度在1~500之间']
        });
    });

</script>


<!-- url编辑弹窗 -->
<div class="layui-form form-dialog" lay-filter="editText" id="editText" >
    <div class="layui-row">
        <div class="layui-col-md11">
            <input class="layui-input hide" lay-verify="required" type="text" name="id">
            <div class="layui-form-item">
                <label class="layui-form-label">网址名称</label>
                <div class="layui-input-block">
                    <input id="edit1" lay-verify="label" type="text" name="label" placeholder="请输入网址名称" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">网址链接</label>
                <div class="layui-input-block">
                    <input id="edit2" lay-verify="myUrl" type="text" name="url"  placeholder="请输入网址链接" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">文件夹</label>
                <div id="location_edit" class="layui-input-block">
                    <input id="folderName_edit" class="layui-input layui-input-inline selectTree" lay-verify="required" type="text" name="pidName" placeholder="请选择文件夹" readonly="readonly">
                    <button class="layui-btn layui-btn-primary selectTree" >选择</button>
                    <button class="layui-btn layui-btn-primary customFolderSetting">自定义</button>
                    <input id="folderId_edit" class="layui-input hide" lay-verify="required" type="text" name="pid">
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="editSubmit">更改</button>
                </div>
            </div>

        </div>
    </div>
</div>


<!-- url批量移动 弹窗 -->
<div class="layui-form form-dialog" lay-filter="moveText" id="moveText">
    <div class="layui-row">
        <div class="layui-col-md11">
            <div class="layui-form-item">
                <label class="layui-form-label">文件夹</label>
                <div id="location_move" class="layui-input-block">
                    <input id="folderName_move" class="layui-input layui-input-inline selectTree" lay-verify="required" type="text" name="pidName" placeholder="请选择文件夹" readonly="readonly">
                    <button class="layui-btn layui-btn-primary selectTree" >选择</button>
                    <button class="layui-btn layui-btn-primary customFolderSetting">自定义</button>
                    <input id="folderId_move" class="layui-input hide" lay-verify="required" type="text" name="pid" >
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="moveSubmit">移动</button>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- 文件夹树弹窗 -->
<div id="folderTree" class="folderTree">
    <input id='searchFolder' type='text' autocomplete='off' placeholder='输入关键字进行文件夹过滤' class='layui-input' >
    <div id="ele" class="eleTree ele1 selectFoldertree" lay-filter="data"></div>

    <script>

        layui.use(["eleTree",'myUtil'], function() {
            eleTree = layui.eleTree;
            var myUtil = layui.myUtil;

            //绑定输入框搜索事件
            $("#searchFolder").on("input",function (e) {
                if($("#searchFolder").val()!=""){
                    var parentDataArrBuff=$.extend(true,[],parentDataArr)
                    var searchTableDataObjBuff=parentDataArrBuff[0];
                    filterTree(searchTableDataObjBuff,$("#searchFolder").val(),parentDataArrBuff,0);
//                    console.dir(parentDataArrBuff)
                    el.reload(parentDataArrBuff);//重新渲染filter文件夹后的数据
                }else{
                    el.reload(parentDataArr);//重新渲染原始数据
                }
            })

            //打开文件夹树弹窗
            $(".selectTree").on("click",function () {
                el.reload();//每次打开都重新请求最新的数据和重新渲染

                folderTree_layer=layer_folderTree.open({
                    type: 1,
                    shadeClose: true,
                    area: ['515px', '351px'], //宽高]
                    content: $("#folderTree")
                });

                $("#searchFolder").val("");//清空数据
                $("#searchFolder").focus();//获取焦点

            })

            //请求自定义文件夹id
            $(".customFolderSetting").on("click",function () {
                myUtil.ajax("/user/getCustomFolder",{},function (data) {
                    if(data.code==0){
                        $("#folderId_move").val(data.data.customFolderId);
                        $("#folderName_move").val(data.data.customFolderName);
                        $("#folderId_edit").val(data.data.customFolderId);
                        $("#folderName_edit").val(data.data.customFolderName);
                    }else{
                        layer.msg(data.message);
                    }
                })
            })

            //请求数据,初始化
            el = eleTree.render({
                elem: '#ele',
                url: '/folder/query',//请求数据的url
                expandOnClickNode: false,//点击节点前的图标才收缩
                defaultExpandAll:true,//默认展开所有节点
                done: function(res){
                    var buff=myUtil.buildTree(res);//转化成树结构
                    searchTableDataObj=buff[0];
                    parentDataArr=buff;
                    return buff;//将平面数据转换成tree数据,返回给data
                }
            });

            eleTree.on("nodeClick(data)", function (d) {
                clickNodeId=d.data.currentData.value;
                $("#folderId_move").val(clickNodeId);
                $("#folderName_move").val(d.data.currentData.label);
                $("#folderId_edit").val(clickNodeId);
                $("#folderName_edit").val(d.data.currentData.label);
                layer_folderTree.close(folderTree_layer);
            });

            //过滤文件夹
            function filterTree(data,keyword,parentData,index) {
                if(data.children==undefined){
                    if(data.label.indexOf(keyword) == -1){//不包含,则删除自身
                        parentData.splice(index,1);
                    }
                    return;
                }

                for(var i=data.children.length-1;i>=0;i--){
                    filterTree(data.children[i],keyword,data.children,i);
                }

                if(data.children.length==0){
                    if(data.label.indexOf(keyword) == -1){//自身不包含,删除自身
                        parentData.splice(index,1);
                    }else{
                        delete data["children"];//自身包含,则删除children字段
                    }
                }
            }

        })

    </script>
</div>
