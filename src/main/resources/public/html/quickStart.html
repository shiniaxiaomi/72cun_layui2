<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>快速入门</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="https://www.usetools.cn/layui/css/layui.css"  media="all">
    <!-- 注意：如果你直接复制所有代码到本地，上述css路径需要改成你本地的 -->

    <style>
        body {
            margin: 0;
        }

        .menu ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #f1f1f1;
            position: fixed;
            height: 100%;
            overflow: auto;
        }

        .menu li a {
            display: block;
            color: #000;
            padding: 8px 16px;
            text-decoration: none;
        }

        .menu li a.active {
            background-color: #4CAF50;
            color: white;
        }

        .menu li a:hover:not(.active) {
            background-color: #555;
            color: white;
        }

        .layui-carousel img{
            height: 80%;
            width: 90%;
        }
    </style>

</head>
<body>


<div class="layui-container" style="width: 90%">

    <div class="layui-row">
        <div class="layui-col-md2">
            <ul class="menu" style="margin-top: 30px">
                <li><a href="javascript:;"><span>1</span>.快速收藏</a></li>
                <li><a href="javascript:;"><span>2</span>.快速打开</a></li>
                <li><a href="javascript:;"><span>3</span>.添加快速工具</a></li>
                <li><a href="javascript:;"><span>4</span>.进入个人后台管理</a></li>
                <li><a href="javascript:;"><span>5</span>.文件夹管理</a></li>
                <li><a href="javascript:;"><span>6</span>.编辑链接</a></li>
                <li><a href="javascript:;"><span>7</span>.导入网址</a></li>
                <li><a href="javascript:;"><span>8</span>.导出网址</a></li>
                <li><a href="javascript:;"><span>9</span>.搜索共享链接</a></li>
                <li><a href="javascript:;"><span>10</span>.查看其他用户的个人首页并搜索</a></li>
            </ul>
        </div>
        <div class="layui-col-md10">
            <div class="layui-carousel" id="test1">
                <div carousel-item style="height: 700px;">
                    <div style="text-align: center">
                        <h1>1.快速收藏</h1><hr>
                        <img lay-src="/gif/快速收藏.gif" >
                    </div>
                    <div style="text-align: center">
                        <h1>2.快速打开</h1><hr>
                        <img lay-src="/gif/快速打开.gif">
                    </div>
                    <div style="text-align: center">
                        <h1>3.添加快速工具</h1><hr>
                        <img lay-src="/gif/添加快速工具.gif">
                    </div>

                    <div style="text-align: center">
                        <h1>4.进入个人后台管理</h1><hr>
                        <img lay-src="/gif/进入个人后台管理.gif">
                    </div>
                    <div style="text-align: center">
                        <h1>5.文件夹管理</h1><hr>
                        <img lay-src="/gif/文件夹管理.gif">
                    </div>
                    <div style="text-align: center">
                        <h1>6.编辑链接</h1><hr>
                        <img lay-src="/gif/编辑链接.gif">
                    </div>
                    <div style="text-align: center">
                        <h1>7.上传网址</h1><hr>
                        <img lay-src="/gif/导入网址.gif">
                    </div>
                    <div style="text-align: center">
                        <h1>8.导出网址</h1><hr>
                        <img lay-src="/gif/导出网址.gif">
                    </div>

                    <div style="text-align: center">
                        <h1>9.搜索共享链接</h1><hr>
                        <img lay-src="/gif/搜索共享链接.gif">
                    </div>
                    <div style="text-align: center">
                        <h1>10.查看其他用户的个人首页并搜索</h1><hr>
                        <img lay-src="/gif/查看其他用户的个人首页并搜索.gif">
                    </div>

                </div>
            </div>
        </div>
    </div>



</div>

<script src="https://www.usetools.cn/layui/layui.js"></script><!-- 需要首先加载 -->
<script src="/myjs/app.js?v=1.0.0"></script>
<script src="https://www.usetools.cn/js/jquery.min.js"></script>
<script>

    layui.use(['carousel','flow'], function(){
        var carousel = layui.carousel;

        //使用图片懒加载
        var flow = layui.flow;
        flow.lazyimg();//当你执行这样一个方法时，即对页面中的全部带有lay-src的img元素开启了懒加载（当然你也可以指定相关img）

        //建造实例
        carousel.render({
            elem: '#test1'
            ,width: '100%' //设置容器宽度
            ,height:'100%'
            ,arrow: 'hover' //悬停显示
            ,autoplay:false
            ,index:0
        });

        var li=$(".menu li");
        for(var i=0;i<li.length;i++){
            $($(li).get(i)).click(function () {
                var index=$(this).find("span").text()-1;
                $(".layui-carousel-ind li").get(index).click();
            })
        }




    });

</script>

</body>
</html>
