# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

     gzip on;  
     gzip_min_length 1k;
     gzip_buffers 4 32k;
     gzip_http_version 1.1; 
     gzip_comp_level 6; 
     gzip_types text/css text/xml application/javascript;
     gzip_vary on; 




    upstream www.usetools.cn{
	#如果多个server的话可以起到负载均衡的效果,如果是一台的话,可以起到转发的效果
	server 127.0.0.1:9999;
    }

    server {
        listen       80;
        server_name  www.usetools.cn;
       
        rewrite ^(.*)$ https://${server_name}$1 permanent; 

    }

# Settings for a TLS enabled server.

    server {
        listen       443 ssl http2 default_server;
        listen       [::]:443 ssl http2 default_server;
        server_name  _;
        root         /usr/share/nginx/html;

        ssl_certificate "/etc/nginx/1_www.usetools.cn_bundle.crt";
        ssl_certificate_key "/etc/nginx/2_www.usetools.cn.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

	#将项目的静态资源移至nginx
	location ~ /(public|myjs|layui|js|images|icon|css)/ {
        		root  /usr/share/nginx/static/;
		expires 1d;
    	}

	#将druid的css和js的静态资源移至nginx
	location ~ /druid/(js|css) {
        		root  /usr/share/nginx/static/;
		expires 1d;
    	}
	
	#其他请求全部转发到后台服务器
        location / {
	    proxy_pass http://www.usetools.cn;
        }

        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }

}

